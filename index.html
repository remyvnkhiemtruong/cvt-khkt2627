<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230284c7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z'/><path d='M6 6h10'/><path d='M6 10h10'/><path d='M6 14h6'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="description" content="Học tốt Ngữ Văn - nền tảng học tập Ngữ văn THPT với hồ sơ học tập, phiên bản, phản hồi, rubric và phân tích tiến bộ." />
    <meta name="application-name" content="Học tốt Ngữ Văn" />
    <title>Học tốt Ngữ Văn | Học tập & Phân tích tiến bộ Ngữ văn THPT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,400;1,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans min-h-screen selection:bg-slate-200 selection:text-slate-900">
    <div id="root"></div>
    <script>
      (function() {
        function neuterAutofill(root) {
          try {
            var forms = (root || document).querySelectorAll('form');
            for (var i = 0; i < forms.length; i++) {
              forms[i].setAttribute('autocomplete', 'off');
            }
            var inputs = (root || document).querySelectorAll('input, textarea');
            for (var j = 0; j < inputs.length; j++) {
              var el = inputs[j];
              if (!el.getAttribute('autocomplete')) {
                el.setAttribute('autocomplete', el.type === 'password' ? 'new-password' : 'one-time-code');
              }
              el.setAttribute('data-lpignore', 'true');
              el.setAttribute('data-1p-ignore', 'true');
              el.setAttribute('data-form-type', 'other');
              el.setAttribute('autocorrect', 'off');
              el.setAttribute('autocapitalize', 'off');
              el.setAttribute('spellcheck', 'false');
            }
          } catch(e) {}
        }
        if (typeof document !== 'undefined') {
          document.addEventListener('DOMContentLoaded', function() {
            neuterAutofill();
            if (window.MutationObserver) {
              new MutationObserver(function(mutations) {
                for (var m = 0; m < mutations.length; m++) {
                  var added = mutations[m].addedNodes;
                  for (var k = 0; k < added.length; k++) {
                    var node = added[k];
                    if (node && node.nodeType === 1) {
                      if (node.tagName === 'INPUT' || node.tagName === 'TEXTAREA' || node.tagName === 'FORM') {
                        neuterAutofill(node.parentElement || document);
                      } else if (node.querySelectorAll) {
                        neuterAutofill(node);
                      }
                    }
                  }
                }
              }).observe(document.documentElement, { childList: true, subtree: true });
            }
          });
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
